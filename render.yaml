# Render Blueprint — SympleOne frontend (deploy sympleone-backend first, then set API URL)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sympleone
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      # Example: https://sympleone-api.onrender.com/api (no trailing slash)
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_TIMEOUT_MS
        value: "30000"
      - key: VITE_AUTH_RELAXED
        value: "false"
