# Render Blueprint: Docker web service serving the Vite SPA via nginx.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sympleone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_API_TIMEOUT_MS
        value: "30000"
    buildFilter:
      paths:
        - "**"
